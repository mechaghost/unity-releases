name: Production ingestion health
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-ingestion-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check data freshness
        id: health
        run: node scripts/check-health.mjs
      - name: Report incident or recovery
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const reconcile = require('./scripts/health-incident.cjs');
            const details = fs.existsSync('.artifacts/health.json')
              ? '```json\n' + fs.readFileSync('.artifacts/health.json', 'utf8') + '\n```'
              : 'The check did not produce a report. Inspect this workflow run.';
            await reconcile({ github, context, failed: '${{ steps.health.outcome }}' !== 'success', details });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-health
          path: .artifacts/health.json
          include-hidden-files: true
          retention-days: 14
