name: Verification
on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unity
          POSTGRES_PASSWORD: unity
          POSTGRES_DB: unity_alerts
        ports: [54329:5432]
        options: >-
          --health-cmd "pg_isready -U unity -d unity_alerts"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:db
      - run: npx tsx tests/db/ingestion-health-db-contract.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
